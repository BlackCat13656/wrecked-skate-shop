<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/cfbb3ea0cd.js"
      crossorigin="anonymous"
    ></script>
    <title>Wrecked Skate Shop</title>
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->

      <nav class="navbar">
        <div class="navbar-center">
          <span class="nav-icon">
            <i class="fas fa-bars"></i>
          </span>
          <img src="./images/wrecked-logo.svg" class="logo" alt="store logo" />
          <div class="cart-btn">
            <span class="nav-icon">
              <i class="fas fa-cart-plus"></i>
            </span>
            <div class="cart-items">0</div>
          </div>
        </div>
      </nav>

      <!-- End of Navbar -->

      <!-- Hero-->

      <header class="hero">
        <div class="banner">
          <h1 class="banner-title">Skate Shop Collection</h1>
          <button class="banner-btn">shop now</button>
        </div>
      </header>

      <!-- End of Hero-->

      <!-- Prodcuts -->

      <section class="products">
        <div class="section-title">
          <h2>Our Products</h2>
        </div>
        <div class="products-center">
          <!-- Single product -->
          <article class="product">
            <div class="img-container">
              <img
                src="./images/products/beanie-1.jpg"
                alt="product"
                class="product-img"
              />
              <button class="bag-button" data-id="1">
                <i class="fas fa-shopping-cart"></i>
                Add to bag
              </button>
            </div>
            <h3>Beanie</h3>
            <h4>$32.49</h4>
          </article>
          <!-- End of Single product -->
        </div>
      </section>
      <!-- End of Prodcuts -->
    </div>

    <script src="script.js"></script>
  </body>
</html>
